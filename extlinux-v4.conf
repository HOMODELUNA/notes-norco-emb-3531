default l2
menu title EMB3531 Headless Server
prompt 1
timeout 1

label l0
 menu label Linux 6.18.24 vendor kernel + vendor dtb (known good)
 linux /Image
 fdt /dtb/rk3399-emb3531.dtb
 append root=/dev/mmcblk2p4 rootwait rw console=ttyS2,115200 console=tty0 net.ifnames=0 earlycon=uart8250,mmio32,0xff1a0000

label l2
 menu label Linux 6.18.24-emb3531 new kernel + vendor dtb (wifi via service)
 linux /Image-emb3531
 fdt /dtb/rk3399-emb3531.dtb
 append root=/dev/mmcblk2p4 rootwait rw console=ttyS2,115200 console=tty0 net.ifnames=0 earlycon=uart8250,mmio32,0xff1a0000

label l3
 menu label Linux 6.18.24-emb3531 PCIe gen1 x1
 linux /Image-emb3531
 fdt /dtb/rk3399-emb3531-pcie1.dtb
 append root=/dev/mmcblk2p4 rootwait rw console=ttyS2,115200 console=tty0 net.ifnames=0 earlycon=uart8250,mmio32,0xff1a0000 pcie_aspm=off

label l4
 menu label Linux 6.18.24-emb3531 PCIe gen2 x4
 linux /Image-emb3531
 fdt /dtb/rk3399-emb3531-pcie4.dtb
 append root=/dev/mmcblk2p4 rootwait rw console=ttyS2,115200 console=tty0 net.ifnames=0 earlycon=uart8250,mmio32,0xff1a0000 pcie_aspm=off

label l5
 menu label Linux 6.18.24-emb3531 PCIe x4 + ep-gpios PERST
 linux /Image-emb3531
 fdt /dtb/rk3399-emb3531-pcie4-ep.dtb
 append root=/dev/mmcblk2p4 rootwait rw console=ttyS2,115200 console=tty0 net.ifnames=0 earlycon=uart8250,mmio32,0xff1a0000 pcie_aspm=off modprobe.blacklist=pcie-rockchip-host,phy-rockchip-pcie
